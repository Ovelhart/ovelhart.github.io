<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-2.css">
    <title>project selection</title>
</head>
<body>
    <div class="barra-cima">

            <img src="img/projects-icon/project-1.png" alt="icon">

                <h4>Project-1 (04/21/2026)</h4>

            </div>
        </div>

        <div onclick="window.open('https://github.com/Ovelhart/minecraft-assets-api', '_blank');" class="world">

                <h3>minecraft assets api</h3>
                <h4>project-2 (05/2/2026)</h4>
                <h4>Creative mode, Cheats, Version: 1.0</h4>
            </div>
        </div>
        
    </div>
    <div class="barra-baixo">
        <button onclick="window.location.href='index.html';" class="cancel">cancel</button>
    </div>
</body>
</html>
