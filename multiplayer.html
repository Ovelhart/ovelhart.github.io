<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-4.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>Multiplayer</title>
</head>
<body>
    <div class="barra-cima">
        <h3>Multiplayer</h3>
    </div>
    <div class="content">
        <div id="markdown">Loading...</div>
    </div>
    <div class="barra-baixo">
        <button onclick="window.location.href='index.html';" class="cancel">to go back</button>
    </div>
</body>
</html>
<script>
const markdownURL =
"https://raw.githubusercontent.com/Ovelhart/Ovelhart/refs/heads/main/README.md";

fetch(markdownURL)
.then(res => res.text())
.then(md => {
    document.getElementById("markdown").innerHTML =
        marked.parse(md);
});
</script>
